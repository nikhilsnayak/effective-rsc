changelog:
  categories:
    - title: Breaking Changes 🍭
      labels:
        - breaking
    - title: New Features 🎉
      labels:
        - feat
    - title: Performance 🚀
      labels:
        - perf
    - title: Bug Fixes 🐞
      labels:
        - fix
    - title: Refactoring 🔨
      labels:
        - refactor
    - title: Documentation 📖
      labels:
        - docs
    - title: Other Changes
      labels:
        - '*'
